name: AI Backend CI

# Python AI backend (ai-backend/): tests, lint, types, and a Docker build with a container smoke test.
# Build only: nothing is pushed or deployed from here.
'on':
  push:
    branches: [main]
    paths:
      - 'ai-backend/**'
      - '.github/workflows/ai-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ai-backend/**'
      - '.github/workflows/ai-backend.yml'

permissions:
  contents: read

concurrency:
  group: ai-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: AI Backend Quality (pytest, Ruff, mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            ai-backend/requirements.txt
            ai-backend/pyproject.toml
      # The pinned runtime set is what the production image installs; the dev tools come on top.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: Pinned requirements are complete and consistent
        run: pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m pytest -q

  docker:
    name: AI Backend Docker Image Build + Smoke Test
    runs-on: ubuntu-latest
    needs: [python-quality]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ai-backend
          file: ai-backend/Dockerfile
          load: true
          push: false
          tags: onusfit-ai-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Runs as a non-root user
        run: test "$(docker run --rm --entrypoint id onusfit-ai-backend:ci -u)" != "0"
      - name: Refuses to start without configuration (production safety)
        run: |
          if docker run --rm onusfit-ai-backend:ci >/tmp/no-config.log 2>&1; then
            echo "the container started without a secret or a Gemini key"; exit 1
          fi
          grep -q "AI_SERVICE_JWT_SECRET is not set" /tmp/no-config.log
          grep -q "GEMINI_API_KEY is not set" /tmp/no-config.log
      - name: Starts on $PORT and answers the health check (no Gemini call)
        run: |
          # Throwaway values generated for this run only (nothing secret is stored in the repository).
          docker run -d --name ai --rm -p 18080:18080 -e PORT=18080 \
            -e AI_SERVICE_JWT_SECRET="$(openssl rand -hex 24)" \
            -e GEMINI_API_KEY="$(openssl rand -hex 16)" \
            onusfit-ai-backend:ci
          body="$(curl --silent --show-error --fail --retry 20 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:18080/health/live)"
          echo "$body"
          echo "$body" | grep -q '"environment":"production"'
          status="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/internal/v1/ai/coach/chat \
            -H 'content-type: application/json' -d '{}')"
          echo "unauthenticated AI call -> HTTP $status"
          test "$status" = "401"
          docker logs ai
          docker stop ai
