name: AI Backend CI

# Python AI backend (ai-backend/): quality gates, deterministic offline AI evals,
# dependency/container security scans, and Docker smoke tests.
# Zero live Gemini API calls run in CI; nothing is pushed or deployed from here.
'on':
  push:
    branches: [main, development]
    paths:
      - 'ai-backend/**'
      - 'compose.yaml'
      - '.github/workflows/ai-backend.yml'
  pull_request:
    branches: [main, development]
    paths:
      - 'ai-backend/**'
      - 'compose.yaml'
      - '.github/workflows/ai-backend.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ai-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: AI Backend Quality (Ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-backend
    env:
      # Explicitly blank out GEMINI_API_KEY so routine CI can never make paid live API calls.
      GEMINI_API_KEY: ''
      ONUSFIT_AI_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            ai-backend/requirements.txt
            ai-backend/pyproject.toml
      # Install exact pinned runtime dependencies matching Dockerfile, plus [dev] test tooling.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: Verify pinned runtime requirements consistency
        run: pip check
      - name: Lint (Ruff)
        run: ruff check .
      - name: Format check (Ruff)
        run: ruff format --check .
      - name: Typecheck (mypy strict)
        run: mypy
      - name: Unit, architecture, and contract tests (pytest)
        run: python -m pytest -q

  ai-evals:
    name: AI Offline Evaluation Gate (0 Live API Calls)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-backend
    env:
      GEMINI_API_KEY: ''
      ONUSFIT_AI_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            ai-backend/requirements.txt
            ai-backend/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: Run offline evaluation pytest suites
        run: python -m pytest tests/evals -q
      - name: Run deterministic offline benchmark runner
        run: python tests/evals/runner.py --baseline tests/evals/datasets/baseline_offline.json --output-json tests/evals/results/ci_report.json --output-md tests/evals/results/ci_report.md
      - name: Assert offline-only execution and 100% pass gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("tests/evals/results/ci_report.json").read_text(encoding="utf-8"))
          assert report["mode"] == "offline", f"Expected offline mode, got {report['mode']}"
          assert report["is_live_evaluation"] is False, "Live evaluation must not run in CI"
          assert report["live_baseline_status"] == "NOT MEASURED"
          summary = report["summary"]
          assert summary["total_cases"] > 0, "Expected non-empty benchmark suite"
          assert summary["failed_cases"] == 0, f"Eval failures: {summary['failed_cases']}"
          gate = report.get("regression_gate") or {}
          assert gate.get("passed") is True, f"Regression gate failed: {gate}"
          assert gate.get("baseline_compared") is True, "Expected baseline comparison in CI gate"
          assert gate.get("critical_safety_failed") is False, f"Critical safety gate failed: {gate}"
          print(f"Verified offline eval gate: {summary['passed_cases']}/{summary['total_cases']} passed ({summary['pass_rate_pct']}%)")
          PY
      - name: Upload offline evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-offline-eval-report
          path: |
            ai-backend/tests/evals/results/ci_report.json
            ai-backend/tests/evals/results/ci_report.md
          retention-days: 14

  security-scan:
    name: AI Backend Dependency & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-backend/requirements.txt
      - name: Python dependency vulnerability audit (pip-audit)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r ai-backend/requirements.txt
      - name: Secret scan on ai-backend directory (Gitleaks)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 dir /repo/ai-backend --gitleaks-ignore-path=/repo/.gitleaksignore --redact --verbose

  docker:
    name: AI Backend Docker Build + Smoke Test + Trivy Scan
    runs-on: ubuntu-latest
    needs: [python-quality, ai-evals]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ai-backend
          file: ai-backend/Dockerfile
          load: true
          push: false
          tags: onusfit-ai-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Runs as a non-root user
        run: test "$(docker run --rm --entrypoint id onusfit-ai-backend:ci -u)" != "0"
      - name: Refuses to start without configuration (production safety)
        run: |
          if docker run --rm onusfit-ai-backend:ci >/tmp/no-config.log 2>&1; then
            echo "The container started without a secret or a Gemini key"; exit 1
          fi
          grep -q "AI_SERVICE_JWT_SECRET is not set" /tmp/no-config.log
          grep -q "GEMINI_API_KEY is not set" /tmp/no-config.log
      - name: Starts on $PORT, answers health check, rejects unauthenticated calls, and stops cleanly
        run: |
          set -euo pipefail
          trap 'docker rm -f ai >/dev/null 2>&1 || true' EXIT
          # Throwaway values for startup validation only (never invokes Gemini).
          docker run -d --name ai -p 18080:18080 -e PORT=18080 \
            -e AI_SERVICE_JWT_SECRET="$(openssl rand -hex 24)" \
            -e GEMINI_API_KEY="$(openssl rand -hex 16)" \
            onusfit-ai-backend:ci
          body="$(curl --silent --show-error --fail --retry 20 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:18080/health/live)"
          echo "$body"
          echo "$body" | grep -q '"environment":"production"'
          status="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/internal/v1/ai/coach/chat \
            -H 'content-type: application/json' -d '{}')"
          echo "unauthenticated AI call -> HTTP $status"
          test "$status" = "401"
          docker logs ai
          docker stop --time 10 ai
      - name: Container vulnerability scan (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.2 image --severity HIGH,CRITICAL --ignore-unfixed --no-progress onusfit-ai-backend:ci
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.2 image --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress onusfit-ai-backend:ci
