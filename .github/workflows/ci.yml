name: CI

'on':
  push:
    branches: [main, development]
    paths:
      - 'backend/**'
      - 'admin/**'
      - 'mobile/**'
      - 'compose.yaml'
      - '.github/workflows/ci.yml'
      - '.gitleaksignore'
  pull_request:
    branches: [main, development]
    paths:
      - 'backend/**'
      - 'admin/**'
      - 'mobile/**'
      - 'compose.yaml'
      - '.github/workflows/ci.yml'
      - '.gitleaksignore'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      admin: ${{ steps.filter.outputs.admin }}
      mobile: ${{ steps.filter.outputs.mobile }}
      infra: ${{ steps.filter.outputs.infra }}
      any: ${{ steps.filter.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          set -euo pipefail
          set_all_true() {
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "admin=true" >> "$GITHUB_OUTPUT"
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            echo "infra=true" >> "$GITHUB_OUTPUT"
            echo "any=true" >> "$GITHUB_OUTPUT"
          }

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            set_all_true
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          HEAD="${{ github.sha }}"

          if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            set_all_true
            exit 0
          fi

          CHANGED="$(git diff --name-only "$BASE" "$HEAD")"
          echo "Changed files:"
          echo "$CHANGED"

          has_match() {
            grep -Eq "$1" <<<"$CHANGED" && echo "true" || echo "false"
          }

          BACKEND=$(has_match '^(backend/|compose\.yaml|\.github/workflows/ci\.yml)')
          ADMIN=$(has_match '^(admin/|backend/|\.github/workflows/ci\.yml)')
          MOBILE=$(has_match '^(mobile/|backend/package-lock\.json|\.github/workflows/ci\.yml)')
          INFRA=$(has_match '^(compose\.yaml|backend/compose\.yaml|backend/Dockerfile|backend/\.dockerignore|\.github/workflows/ci\.yml)')
          ANY="false"
          if [[ "$BACKEND" == "true" || "$ADMIN" == "true" || "$MOBILE" == "true" || "$INFRA" == "true" ]] || grep -Eq '^\.gitleaksignore$' <<<"$CHANGED"; then
            ANY="true"
          fi

          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "admin=$ADMIN" >> "$GITHUB_OUTPUT"
          echo "mobile=$MOBILE" >> "$GITHUB_OUTPUT"
          echo "infra=$INFRA" >> "$GITHUB_OUTPUT"
          echo "any=$ANY" >> "$GITHUB_OUTPUT"

  backend-quality:
    name: Backend Quality (Typecheck, Lint, Format, Unit Tests, Build)
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Validate .env.example configuration parsing
        run: |
          node --env-file=.env.example --import tsx -e "import { loadConfig } from './src/config/env.js'; const c = loadConfig(process.env); console.log('env.example validated:', c.env);"
      - name: Dependency audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high

  backend-migrations:
    name: Backend Migration Smoke Test (Isolated pgvector Container)
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d ci" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Apply all migrations
        run: node dist/scripts/migrate.js
      - name: Re-run is a no-op
        run: node dist/scripts/migrate.js | grep -q "Nothing to apply"
      - run: node dist/scripts/migrate.js status

  backend-integration:
    name: Backend Integration Tests (PostgreSQL 17 + pgvector)
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:int

  mobile-quality:
    name: Mobile Quality (Typecheck, Lint, Automated Tests)
    needs: [changes]
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            backend/package-lock.json
      - run: npm ci
      - name: Install backend dependencies for mobile tsx test runner
        working-directory: .
        run: npm ci --prefix backend
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Dependency audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high

  admin-quality:
    name: Admin Quality (Typecheck, Lint, Build, Automated Tests)
    needs: [changes]
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: |
            admin/package-lock.json
            backend/package-lock.json
      - run: npm ci
      - name: Install backend dependencies for admin contract tests
        working-directory: .
        run: npm ci --prefix backend
      - name: Admin Typecheck
        run: node_modules/.bin/tsc --noEmit
      - name: Admin Lint
        run: npm run lint
      - name: Admin Production Build
        run: npm run build
      - name: Admin Automated Tests
        run: npm test
      - name: Dependency audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high

  compose-validate:
    name: Compose & Env Template Validation
    needs: [changes]
    if: needs.changes.outputs.infra == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configurations using example env files
        run: |
          set -euo pipefail
          cp backend/.env.example backend/.env
          cp ai-backend/.env.example ai-backend/.env
          trap 'rm -f backend/.env ai-backend/.env' EXIT
          docker compose -f compose.yaml --profile local-db --profile local-migrate --profile app config -q
          docker compose -f backend/compose.yaml --profile app config -q
          test -f admin/.env.example
          test -f mobile/.env.example

  secrets:
    name: Secret Scan (Gitleaks)
    needs: [changes]
    if: always() && (needs.changes.outputs.any == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --gitleaks-ignore-path=/repo/.gitleaksignore --redact --verbose

  docker:
    name: Backend Docker Build + Smoke Test + Trivy Scan
    runs-on: ubuntu-latest
    needs: [changes, backend-quality]
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          load: true
          push: false
          tags: fitonus-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify non-root runtime user
        run: test "$(docker run --rm --entrypoint id fitonus-backend:ci -u)" != "0"
      - name: Verify fail-closed production configuration check
        run: |
          if docker run --rm -e NODE_ENV=production fitonus-backend:ci >/tmp/backend-no-config.log 2>&1; then
            echo "Container started without required configuration"; exit 1
          fi
          grep -q "Invalid configuration" /tmp/backend-no-config.log
      - name: Verify health/ready, migrations, and graceful SIGTERM shutdown
        run: |
          set -euo pipefail
          NET="fitonus-ci-net-$$"
          PG_NAME="fitonus-ci-pg-$$"
          API_NAME="fitonus-ci-api-$$"
          cleanup() {
            docker rm -f "$API_NAME" "$PG_NAME" >/dev/null 2>&1 || true
            docker network rm "$NET" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create "$NET" >/dev/null
          docker run -d --name "$PG_NAME" --network "$NET" \
            -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=ci \
            pgvector/pgvector:pg17 >/dev/null

          for _ in $(seq 1 30); do
            if docker exec "$PG_NAME" pg_isready -U postgres -d ci >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          DB_URL="postgres://postgres@${PG_NAME}:5432/ci"
          docker run --rm --network "$NET" -e DATABASE_URL="$DB_URL" \
            fitonus-backend:ci node dist/scripts/migrate.js

          JWT_SECRET="$(openssl rand -hex 24)"
          HMAC_SEC="$(openssl rand -hex 24)"
          AI_SEC="$(openssl rand -hex 24)"

          docker run -d --name "$API_NAME" --network "$NET" -p 13000:3000 \
            -e NODE_ENV=production \
            -e HOST=0.0.0.0 \
            -e PORT=3000 \
            -e DATABASE_URL="$DB_URL" \
            -e DATABASE_SSL=disable \
            -e JWT_ACCESS_SECRET="$JWT_SECRET" \
            -e HMAC_SECRET="$HMAC_SEC" \
            -e JWT_ISSUER=fitonus-ci \
            -e JWT_AUDIENCE=fitonus-clients \
            -e CORS_ORIGINS=https://fit-onus.vercel.app \
            -e LOG_PRETTY=false \
            -e AUTH_PUBLIC_REGISTRATION=false \
            -e AI_BACKEND_URL=http://127.0.0.1:10000 \
            -e AI_BACKEND_SERVICE_SECRET="$AI_SEC" \
            fitonus-backend:ci >/dev/null

          curl --silent --show-error --fail --retry 20 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:13000/health/live
          curl --silent --show-error --fail --retry 10 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:13000/health/ready
          docker stop --time 15 "$API_NAME"
      - name: Container vulnerability scan (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.2 image --severity HIGH,CRITICAL --ignore-unfixed --no-progress fitonus-backend:ci
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.2 image --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress fitonus-backend:ci
