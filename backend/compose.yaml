# Local development for the Node.js backend.
#   docker compose up -d db                # local PostgreSQL 17 + pgvector only (typical local dev)
#   docker compose --profile app up --build # db + one-off migrate + containerized Node API
# All credentials come from backend/.env (gitignored); never commit real secrets.
name: fitonus-backend

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app_dev}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # Bound to localhost only; never exposed on external interfaces.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    mem_limit: 512m
    cpus: '1.0'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    profiles: [app]
    build: .
    command: ['node', 'dist/scripts/migrate.js']
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-app_dev}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: '0.5'

  api:
    profiles: [app]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-app_dev}
      NODE_ENV: ${APP_NODE_ENV:-development}
      HOST: 0.0.0.0
      LOG_PRETTY: 'false'
    ports:
      - '127.0.0.1:${PORT:-3000}:3000'
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 20s
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: '1.0'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  db-data:
