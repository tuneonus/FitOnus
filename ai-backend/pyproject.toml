[project]
name = "onusfit-ai"
version = "0.1.0"
description = "OnusFit Python AI backend (FastAPI). Internal service called by the Node.js backend."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "google-genai>=1.0",   # official Google Gemini SDK
    "pyjwt>=2.8",          # verifies the service token sent by Node
    "httpx>=0.27",         # imported by llm/errors.py to recognise HTTP timeouts (not pulled in by google-genai)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onusfit_ai"]

[tool.pytest.ini_options]
# Lets `pytest` import the package from src/ without installing it first.
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is `param = Depends(...)`.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
# The prompt is ported verbatim from Node (long lines are intentional); tests favour readability.
"src/onusfit_ai/prompts/*" = ["E501"]
"tests/*" = ["E501", "E401", "E402"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["onusfit_ai"]
